
name: Deploy React to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-react-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Diagnose Tailscale connection
        run: |
          echo "=== Tailscale devices ==="
          tailscale status

          echo "=== Ping Coolify server ==="
          tailscale ping --c 3 100.109.127.122 || true

          echo "=== DNS ==="
          getent ahostsv4 coolifyserver.taile64c6b.ts.net || true

          echo "=== Coolify HTTPS ==="
          curl -4 --verbose \
            --connect-timeout 10 \
            --max-time 20 \
            https://coolifyserver.taile64c6b.ts.net/api/v1/health

      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail-with-body --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json" \
            "https://coolifyserver.taile64c6b.ts.net/api/v1/deploy?uuid=nrfa3iwuggbrxqlafzkyjx3q"
